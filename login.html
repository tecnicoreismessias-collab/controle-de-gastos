<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar — Meu Controle Financeiro</title><style>:root{--bg:#f4f6fa;--card:#fff;--ink:#182033;--muted:#697386;--line:#e5e7eb;--p:#2563eb;--r:#dc2626;--shadow:0 20px 60px rgba(15,23,42,.12)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#eef4ff,#f8fafc);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink);display:flex;flex-direction:column;align-items:center;padding:24px}.box{width:min(440px,100%);background:#fff;margin:auto;border:1px solid var(--line);border-radius:24px;padding:32px;box-shadow:var(--shadow)}.brand{text-align:center;font-size:26px;font-weight:950}.sub{text-align:center;color:var(--muted);margin:8px 0 26px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#f1f5f9;padding:5px;border-radius:12px;margin-bottom:20px}.tabs button{border:0;background:transparent;padding:10px;border-radius:9px;font-weight:800;cursor:pointer}.tabs button.active{background:#fff;color:var(--p);box-shadow:0 2px 8px rgba(15,23,42,.08)}label{display:block;font-size:12px;font-weight:800;margin:14px 0 6px}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;font-size:14px;outline:none}input:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(37,99,235,.1)}.primary{width:100%;margin-top:20px;padding:13px;border:0;border-radius:11px;background:var(--p);color:#fff;font-weight:900;cursor:pointer}.link{border:0;background:none;color:var(--p);font-weight:800;cursor:pointer;padding:0}.msg{margin-top:14px;padding:11px;border-radius:10px;font-size:13px;display:none}.msg.show{display:block}.error{background:#fee2e2;color:#991b1b}.ok{background:#dcfce7;color:#166534}.forgot{text-align:right;margin-top:10px;font-size:12px}.namefield{display:none}</style><style>.project-footer{width:100%;text-align:center;padding:22px 16px 18px;color:#94a3b8;font-size:12px;font-weight:700;letter-spacing:.2px}.project-footer::first-letter{text-transform:lowercase}</style></head><body><div class="box"><div class="brand">Meu Controle Financeiro</div><div class="sub">Controle seus gastos de forma simples e segura.</div><div class="tabs"><button id="tabLogin" class="active" onclick="setMode('login')">Entrar</button><button id="tabSignup" onclick="setMode('signup')">Criar conta</button></div><form id="form"><div id="nameWrap" class="namefield"><label>Nome</label><input id="name" autocomplete="name"></div><label>E-mail</label><input id="email" type="email" autocomplete="email" required><div id="passwordWrap"><label>Senha</label><input id="password" type="password" autocomplete="current-password" minlength="6" required></div><div id="newPasswordWrap" style="display:none"><label>Nova senha</label><input id="newPassword" type="password" minlength="6"></div><div id="forgot" class="forgot"><button type="button" class="link" onclick="setMode('forgot')">Esqueci minha senha</button></div><button class="primary" id="submit">Entrar</button></form><div id="msg" class="msg"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script>
let mode='login';
async function afterAuth(){
  const {data:{session}}=await supabaseClient.auth.getSession();
  if(!session) return 'login.html';
  await prepareUserSpace(session.user);
  return 'index.html';
}
function setMode(m){mode=m;document.getElementById('tabLogin').classList.toggle('active',m==='login');document.getElementById('tabSignup').classList.toggle('active',m==='signup');document.getElementById('nameWrap').style.display=m==='signup'?'block':'none';document.getElementById('passwordWrap').style.display=m==='forgot'||m==='reset'?'none':'block';document.getElementById('newPasswordWrap').style.display=m==='reset'?'block':'none';document.getElementById('forgot').style.display=m==='login'?'block':'none';document.getElementById('submit').textContent=m==='login'?'Entrar':m==='signup'?'Criar conta':m==='reset'?'Salvar nova senha':'Enviar link de recuperação';show('');}
function show(t,ok=false){let e=document.getElementById('msg');e.textContent=t;e.className='msg '+(t?(ok?'show ok':'show error'):'');}
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();show('');let email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,name=document.getElementById('name').value.trim();document.getElementById('submit').disabled=true;try{if(mode==='login'){let r=await supabaseClient.auth.signInWithPassword({email,password});if(r.error)throw r.error;await prepareUserSpace(r.data.user);const {data:profile}=await supabaseClient.from('profiles').select('name,start_date').eq('id',r.data.user.id).maybeSingle();location.href=(profile?.name||profile?.start_date)?'index.html':'configuracao.html'}else if(mode==='signup'){let r=await supabaseClient.auth.signUp({email,password,options:{data:{name}}});if(r.error)throw r.error;show('Conta criada. Verifique seu e-mail para confirmar o cadastro.',true)}else if(mode==='reset'){let r=await supabaseClient.auth.updateUser({password:document.getElementById('newPassword').value});if(r.error)throw r.error;await prepareUserSpace(r.data.user);const {data:profile}=await supabaseClient.from('profiles').select('name,start_date').eq('id',r.data.user.id).maybeSingle();show('Senha alterada com sucesso. Entrando...',true);setTimeout(()=>location.href=(profile?.name||profile?.start_date)?'index.html':'configuracao.html',900)}else{let r=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(r.error)throw r.error;show('Se o e-mail estiver cadastrado, enviaremos um link para redefinir sua senha.',true)}}catch(err){show(err.message||'Não foi possível concluir a operação.')}finally{document.getElementById('submit').disabled=false}});
const recovery=new URLSearchParams(location.search).get('mode')==='recovery';if(recovery)setMode('reset');supabaseClient.auth.getSession().then(async({data:{session}})=>{if(session&&!recovery){await prepareUserSpace(session.user);const {data:profile}=await supabaseClient.from('profiles').select('name,start_date').eq('id',session.user.id).maybeSingle();location.href=(profile?.name||profile?.start_date)?'index.html':'configuracao.html'}});
</script><footer class="project-footer">project by tecnicoreis.messias@gmail.com</footer></body></html>
